[package]
name = "axun"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenv = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
surrealdb = "4.0.0"
tokio = { version = "1.54.1", features = ["full", "macros", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "set-header", "trace"] }

models.workspace = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
